name: CI

on:
  push:
    branches: [master, "**"]
  pull_request:
  workflow_dispatch:

env:
  # Homebrew's `sdl2` formula is now only an alias for sdl2-compat, which is a
  # shim over SDL3 and is exactly what this port must not link (see the
  # SDL2_PREFIX comment in the Makefile). There is no longer any brew formula
  # for real SDL2, so CI builds it from the upstream release tarball. Keep this
  # in step with the version developers have under Cellar/sdl2.
  SDL2_VERSION: "2.32.10"

jobs:
  # Built once and cached, then restored by both consumer jobs, so a green cache
  # costs a download rather than a compile in each of them.
  sdl2:
    name: Build real SDL2
    runs-on: macos-latest
    steps:
      - name: Cache SDL2
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/sdl2
          key: sdl2-${{ runner.os }}-${{ runner.arch }}-${{ env.SDL2_VERSION }}

      - name: Build SDL2 from source
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o sdl2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          tar xzf sdl2.tar.gz
          cd "SDL2-${SDL2_VERSION}"
          ./configure --prefix="$HOME/sdl2"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      # Cheap insurance that the cache holds what we think it does: a restored
      # shim would otherwise only surface as a baffling runtime failure.
      - name: Verify it is real SDL2
        run: |
          set -euo pipefail
          test -f "$HOME/sdl2/include/SDL2/SDL.h"
          test -f "$HOME/sdl2/lib/libSDL2-2.0.0.dylib"
          if otool -L "$HOME/sdl2/lib/libSDL2-2.0.0.dylib" \
              | grep -qiE 'libSDL3|sdl2-compat|sdl12-compat'; then
            echo "ERROR: built library is an SDL shim, not real SDL2" >&2
            otool -L "$HOME/sdl2/lib/libSDL2-2.0.0.dylib" >&2
            exit 1
          fi

  unit-tests:
    name: Unit tests (Criterion, ASan + UBSan)
    runs-on: macos-latest
    needs: sdl2
    steps:
      - uses: actions/checkout@v4

      - name: Install Criterion
        run: brew install criterion

      # The png suite compiles renderer sources, which reach SDL_opengl.h
      # through qgl.h, so this job needs the SDL2 headers too.
      - name: Restore SDL2
        uses: actions/cache/restore@v4
        with:
          path: ~/sdl2
          key: sdl2-${{ runner.os }}-${{ runner.arch }}-${{ env.SDL2_VERSION }}
          fail-on-cache-miss: true

      # Absolute, because make does not expand ~ inside an -I flag.
      - name: Point the build at real SDL2
        run: echo "SDL2_PREFIX=$HOME/sdl2" >> "$GITHUB_ENV"

      # Cheap and catches a whole defect class, so it runs before the build.
      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: JUnit report
        if: always()
        run: make test-report

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: tests/bin/report/*.xml
          if-no-files-found: warn

  build:
    name: Build engine and game modules
    runs-on: macos-latest
    needs: sdl2
    steps:
      - uses: actions/checkout@v4

      # The client links these from /opt/homebrew/lib; they are not preinstalled
      # on the runner image.
      - name: Install audio codecs
        run: brew install libogg libvorbis

      - name: Restore SDL2
        uses: actions/cache/restore@v4
        with:
          path: ~/sdl2
          key: sdl2-${{ runner.os }}-${{ runner.arch }}-${{ env.SDL2_VERSION }}
          fail-on-cache-miss: true

      # Absolute, because make does not expand ~ inside an -I flag.
      - name: Point the build at real SDL2
        run: echo "SDL2_PREFIX=$HOME/sdl2" >> "$GITHUB_ENV"

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Verify SDL linkage is shim-free
        run: |
          bin=$(ls Build/Release-darwin-*/ZEQ2.* 2>/dev/null | head -1)
          if [ -z "$bin" ]; then echo "no engine binary produced"; exit 1; fi
          otool -L "$bin" | grep -i sdl || true
          if otool -L "$bin" | grep -qiE "sdl12-compat|sdl2-compat|SDL3"; then
            echo "ERROR: engine links an SDL shim instead of real SDL2"
            exit 1
          fi

  # The smoke and sanitizer suites need the ~324MB game data, which is not in
  # this repository, so they cannot run on a clean CI checkout. Run them locally:
  #   Tools/dev/zeq2smoke.sh --seconds 20 --dedicated
  #   Tools/dev/zeq2sanitize.sh
  # Wire them up here once the data is available to CI (artifact, cache or LFS).
