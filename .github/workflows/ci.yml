name: CI

on:
  push:
    branches: [master, "**"]
  pull_request:
  workflow_dispatch:

env:
  # Homebrew's `sdl2` formula is now only an alias for sdl2-compat, which is a
  # shim over SDL3 and is exactly what this port must not link (see the
  # SDL2_PREFIX comment in the Makefile). There is no longer any brew formula
  # for real SDL2, so CI builds it from the upstream release tarball. Keep this
  # in step with the version developers have under Cellar/sdl2.
  SDL2_VERSION: "2.32.10"

jobs:
  # Built once and cached, then restored by both consumer jobs, so a green cache
  # costs a download rather than a compile in each of them.
  sdl2:
    name: Build real SDL2
    runs-on: macos-latest
    steps:
      - name: Cache SDL2
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/sdl2
          key: sdl2-${{ runner.os }}-${{ runner.arch }}-${{ env.SDL2_VERSION }}

      - name: Build SDL2 from source
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o sdl2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          tar xzf sdl2.tar.gz
          cd "SDL2-${SDL2_VERSION}"
          ./configure --prefix="$HOME/sdl2"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      # Cheap insurance that the cache holds what we think it does: a restored
      # shim would otherwise only surface as a baffling runtime failure.
      - name: Verify it is real SDL2
        run: |
          set -euo pipefail
          test -f "$HOME/sdl2/include/SDL2/SDL.h"
          test -f "$HOME/sdl2/lib/libSDL2-2.0.0.dylib"
          if otool -L "$HOME/sdl2/lib/libSDL2-2.0.0.dylib" \
              | grep -qiE 'libSDL3|sdl2-compat|sdl12-compat'; then
            echo "ERROR: built library is an SDL shim, not real SDL2" >&2
            otool -L "$HOME/sdl2/lib/libSDL2-2.0.0.dylib" >&2
            exit 1
          fi

  unit-tests:
    name: macOS unit tests (Criterion, ASan + UBSan)
    runs-on: macos-latest
    needs: sdl2
    steps:
      - uses: actions/checkout@v4

      - name: Install Criterion
        run: brew install criterion

      # The png suite compiles renderer sources, which reach SDL_opengl.h
      # through qgl.h, so this job needs the SDL2 headers too.
      - name: Restore SDL2
        uses: actions/cache/restore@v4
        with:
          path: ~/sdl2
          key: sdl2-${{ runner.os }}-${{ runner.arch }}-${{ env.SDL2_VERSION }}
          fail-on-cache-miss: true

      # Absolute, because make does not expand ~ inside an -I flag.
      - name: Point the build at real SDL2
        run: echo "SDL2_PREFIX=$HOME/sdl2" >> "$GITHUB_ENV"

      # Cheap and catches a whole defect class, so it runs before the build.
      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: JUnit report
        if: always()
        run: make test-report

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: tests/bin/report/*.xml
          if-no-files-found: warn

  build:
    name: macOS build (engine, renderer, game modules)
    runs-on: macos-latest
    needs: sdl2
    steps:
      - uses: actions/checkout@v4

      # The client links these from /opt/homebrew/lib; they are not preinstalled
      # on the runner image.
      - name: Install audio codecs
        run: brew install libogg libvorbis

      - name: Restore SDL2
        uses: actions/cache/restore@v4
        with:
          path: ~/sdl2
          key: sdl2-${{ runner.os }}-${{ runner.arch }}-${{ env.SDL2_VERSION }}
          fail-on-cache-miss: true

      # Absolute, because make does not expand ~ inside an -I flag.
      - name: Point the build at real SDL2
        run: echo "SDL2_PREFIX=$HOME/sdl2" >> "$GITHUB_ENV"

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Verify SDL linkage is shim-free
        run: |
          bin=$(ls Build/Release-darwin-*/ZEQ2.* 2>/dev/null | head -1)
          if [ -z "$bin" ]; then echo "no engine binary produced"; exit 1; fi
          otool -L "$bin" | grep -i sdl || true
          if otool -L "$bin" | grep -qiE "sdl12-compat|sdl2-compat|SDL3"; then
            echo "ERROR: engine links an SDL shim instead of real SDL2"
            exit 1
          fi

  # Linux is a first-class target again: the port replaced Engine/sdl/*.c with
  # SDL2 sources, and until this job existed nothing checked that any platform
  # other than darwin-arm still compiled them. Distro SDL2 is real SDL2, so
  # there is no from-source build and no shim dance here - the whole macOS
  # SDL2_VERSION apparatus is a Homebrew problem, not a Linux one.
  linux-unit-tests:
    name: Linux unit tests (Criterion, ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gcc rather than clang for parity with the macOS job's sanitizers:
      # Ubuntu's clang package ships no compiler-rt, so -fsanitize=address
      # fails at link with a missing libclang_rt.asan. libasan comes with gcc,
      # and -fno-sanitize-recover=undefined means the same thing to both.
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libcriterion-dev libsdl2-dev

      # Both default to /opt/homebrew in tests/Makefile, which is a macOS path.
      - name: Point the test build at the distro packages
        run: |
          {
            echo "CRITERION_PREFIX=/usr"
            echo "SDL2_PREFIX=/usr"
            echo "CC=gcc"
          } >> "$GITHUB_ENV"

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: JUnit report
        if: always()
        run: make test-report

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-linux
          path: tests/bin/report/*.xml
          if-no-files-found: warn

  linux-build:
    name: Linux build (engine, renderer, game modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libgl1-mesa-dev for the renderer's -lGL, the ogg/vorbis pair for the
      # client's codec support, which is on by default.
      #
      # bison because lburg/gram.c is checked in but make's builtin %.c: %.y
      # rule still fires whenever the checkout leaves gram.y no older than
      # gram.c, which for a fresh clone is a coin toss. Without yacc that is a
      # bare "Error 127" a long way from anything that mentions yacc.
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison libsdl2-dev libgl1-mesa-dev \
            libogg-dev libvorbis-dev

      - name: Build
        run: make -j"$(nproc)"

      # The failure this guards is the one the port left behind: Engine/sdl/*.c
      # are SDL2 sources, and the bundled SDL 1.2 headers used to be on the
      # include path beside them. Linking real SDL2 is the proof that the right
      # headers won.
      - name: Verify the engine links real SDL2
        run: |
          set -euo pipefail
          bin=$(ls Build/Release-linux-*/ZEQ2.* 2>/dev/null | head -1)
          if [ -z "$bin" ]; then echo "no engine binary produced"; exit 1; fi
          ldd "$bin" | grep -i sdl || true
          if ! ldd "$bin" | grep -q "libSDL2-2.0"; then
            echo "ERROR: engine does not link libSDL2"
            exit 1
          fi
          if ldd "$bin" | grep -qiE "libSDL-1|libSDL3"; then
            echo "ERROR: engine links SDL 1.2 or SDL3"
            exit 1
          fi

      # x86_64 sets HAVE_VM_COMPILED, so this is the only job anywhere that
      # runs the q3lcc/q3asm toolchain: darwin-arm and linux-aarch64 both set
      # BUILD_GAME_QVM=0 for want of a bytecode JIT. Two defects reached this
      # branch precisely because nothing compiled the bytecode - assert the
      # QVMs exist so that stays true.
      - name: Verify the game modules and QVMs were produced
        run: |
          set -euo pipefail
          ls -la Build/Release-linux-*/Base/*.so Build/Release-linux-*/Base/vm/*.qvm
          for m in cgame game ui; do
            ls Build/Release-linux-*/Base/${m}*.so >/dev/null
            ls Build/Release-linux-*/Base/vm/${m}.qvm >/dev/null
          done

  # The smoke, duel and sanitizer gates all need the ~324MB game data, which is
  # not in this repository, so none of them can run on a clean CI checkout. Run
  # them locally:
  #   Tools/dev/zeq2smoke.sh --seconds 20 --dedicated
  #   Tools/dev/zeq2duel.sh --seconds 240 --skill 5 --assert
  #   Tools/dev/zeq2sanitize.sh
  #
  # The duel is the balance regression gate: two AI fighters, real usercmds, and
  # assertions on the shape of the fight rather than on any single number. It is
  # the only check here that can catch combat quietly ceasing to function - the
  # unit suites cannot see it and the smoke gate only asserts the map loads.
  # Wire all three up once the data is available to CI (artifact, cache or LFS).
